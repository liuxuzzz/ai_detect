name: Build Desktop Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Validate version and release tag
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('pubspec.yaml').read_text()
          version = re.search(r'^version: (\d+\.\d+\.\d+)\+\d+$', text, re.M).group(1)
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/') and ref != 'refs/tags/v' + version:
              raise SystemExit('Release tag must match pubspec.yaml: v' + version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - run: flutter pub get --enforce-lockfile
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: python3 tool/bootstrap_duckdb.py
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux build and installer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm patchelf xvfb
      - run: flutter pub get --enforce-lockfile
      - name: Prepare checksum-verified DuckDB native library
        run: python tool/bootstrap_duckdb.py
      - name: Verify Windows HTML and animation in WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tool/prepare_webview2.ps1 -Install
          flutter test integration_test/windows_html_preview_test.dart -d windows
      - name: Build desktop release
        shell: bash
        run: flutter build ${{ matrix.platform }} --release --no-pub --build-name="$APP_VERSION"
      - name: Include Windows C++ runtime and installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $redist) { throw 'Visual C++ runtime not found' }
          Copy-Item "$($redist.FullName)\*.dll" build/windows/x64/runner/Release/
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Package installers, portable bundles and checksums
        if: runner.os != 'Windows'
        shell: bash
        run: python tool/package_desktop.py --version "$APP_VERSION"
      - name: Prepare WebView2 and package Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tool/prepare_webview2.ps1
          python tool/package_desktop.py --version "$env:APP_VERSION"
      - name: Verify macOS universal bundle
        if: runner.os == 'macOS'
        run: |
          lipo 'build/macos/Build/Products/Release/AI质量检测.app/Contents/MacOS/AI质量检测' -verify_arch x86_64 arm64
          codesign --verify --deep --strict 'build/macos/Build/Products/Release/AI质量检测.app'
          hdiutil verify release/*.dmg
      - name: Verify Linux installers
        if: runner.os == 'Linux'
        run: |
          test ! -e build/linux/x64/release/bundle/lib/libdartjni.so
          dpkg-deb --info release/*.deb
          rpm -qip release/*.rpm
          env -u JAVA_HOME -u JDK_HOME -u LD_LIBRARY_PATH xvfb-run -a python3 tool/smoke_desktop.py build/linux/x64/release/bundle/aijiance
      - name: Verify Windows portable bundle
        if: runner.os == 'Windows'
        run: python tool/smoke_desktop.py build/windows/x64/runner/Release/aijiance.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-detect-${{ env.APP_VERSION }}-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-detect-*
          path: release
          merge-multiple: true
      - name: Verify checksums and publish downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          sed -i 's/\r$//' release/*.sha256
          (cd release && cat *.sha256 | sha256sum --check)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "AI质量检测 $RELEASE_TAG" --notes-file CHANGELOG.md --draft
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
