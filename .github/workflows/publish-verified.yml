name: Publish Verified Desktop Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.1'
        required: true
        type: string
      run_id:
        description: 'Successful main-branch Build Desktop Installers run for that tag commit'
        required: true
        type: string

permissions:
  actions: read
  contents: write

# Reuse the tag build's group so promotion cancels redundant queued builds.
concurrency:
  group: desktop-Build Desktop Installers-refs/tags/${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify source build, tag and artifact versions
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          tag, run_id = os.environ['RELEASE_TAG'], os.environ['SOURCE_RUN']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or not run_id.isdigit():
              raise SystemExit('Expected a semantic version tag and numeric run ID')
          version = re.search(r'^version: (\d+\.\d+\.\d+)\+\d+$', pathlib.Path('pubspec.yaml').read_text(), re.M).group(1)
          assert tag == 'v' + version, 'Tag must match the checked-out application version'
          prefix = 'repos/' + os.environ['GH_REPO']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', prefix + path], text=True))
          run = api('/actions/runs/' + run_id)
          assert run['name'] == 'Build Desktop Installers'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          assert run['conclusion'] == 'success', 'All source build checks must pass'
          assert run['head_sha'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'Tag must point to the verified build commit'
          artifacts = api('/actions/runs/' + run_id + '/artifacts?per_page=100')['artifacts']
          names = {item['name'] for item in artifacts if not item['expired']}
          assert {f'ai-detect-{version}-{platform}' for platform in ['windows', 'macos', 'linux']} <= names
          print('Verified all platforms for ' + tag + ' at ' + run['head_sha'])
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: ai-detect-*
          path: release
          merge-multiple: true
      - name: Verify installers and publish assets
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          version = os.environ['RELEASE_TAG'][1:]
          suffixes = ['windows-x64-setup.exe', 'windows-x64-portable.zip',
                      'macos-universal.dmg', 'macos-universal.zip',
                      'linux-amd64.deb', 'linux-x86_64.rpm', 'linux-x64.tar.gz']
          expected = set()
          for suffix in suffixes:
              name = f'ai-detect-{version}-{suffix}'
              path = pathlib.Path('release') / name
              digest, filename = path.with_name(name + '.sha256').read_text().split()
              assert filename == name and path.stat().st_size > 0
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              expected.update([name, name + '.sha256'])
          assert {path.name for path in pathlib.Path('release').iterdir()} == expected
          PY
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "AI质量检测 $RELEASE_TAG" --notes-file CHANGELOG.md --draft
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
