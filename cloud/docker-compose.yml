name: aijiance-cloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aijiance}
      POSTGRES_USER: ${POSTGRES_USER:-aijiance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "${SERVER_BIND_ADDRESS:-0.0.0.0}:${SERVER_PORT:-8081}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-aijiance}:${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aijiance}}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-8}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 配置 JWT_SECRET}
      CLIENT_KEY_ENCRYPTION_SECRET: ${CLIENT_KEY_ENCRYPTION_SECRET:-}
      API_PUBLIC_BASE_URL: ${WEB_API_BASE_URL:-http://127.0.0.1:8081}
      APP_ENV: prod
      BIND_ADDRESS: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TASK_DAILY_LIMIT: ${TASK_DAILY_LIMIT:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  web:
    build: ./web
    environment:
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:-}
      API_PORT: ${SERVER_PORT:-8081}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
volumes:
  postgres_data:
  redis_data:
